name: arcane_dispatch
description: "An Arcane macOS menu bar SOCKS proxy that dispatches traffic across network interfaces."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  arcane: ^6.5.13
  arcane_desktop: ^2.1.0
  fast_log: ^1.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  screen_retriever: ^0.2.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
